<div class="container mt-4">
    <h2>Valuation Input</h2>
  
    <form [formGroup]="valuationForm" (ngSubmit)="submitValuation()">
      <!-- Company Info -->
<!-- Company and Country -->
<div class="row row-cols-1 row-cols-md-2 g-3 mb-3">
  <div class="col">
    <label for="companyCode" class="form-label">Company Code</label>
    <input formControlName="companyCode" class="form-control form-control-sm" id="companyCode" required />
  </div>
  <div class="col">
    <label for="country" class="form-label">Country</label>
    <select formControlName="country" class="form-select form-select-sm">
      <option value="UAE">UAE</option>
      <option value="Saudi Arabia">Saudi Arabia</option>
      <option value="Qatar">Qatar</option>
      <option value="India">India</option>
      <option value="USA">USA</option>
    </select>
  </div>
</div>

<!-- Financial Settings -->
<div class="row row-cols-2 row-cols-md-4 g-3 mb-3">
  <div class="col">
    <label class="form-label">Discount Rate (%)</label>
    <input formControlName="discountRate" type="number" class="form-control form-control-sm" />
  </div>
  <div class="col">
    <label class="form-label">Tax Rate (%)</label>
    <input formControlName="taxRate" type="number" class="form-control form-control-sm" />
  </div>
  <div class="col">
    <label class="form-label">Actual Years</label>
    <input formControlName="actualYears" type="number" class="form-control form-control-sm" />
  </div>
  <div class="col">
    <label class="form-label">Projected Years</label>
    <input formControlName="projectedYears" type="number" class="form-control form-control-sm" />
  </div>
</div>

<!-- Generate Button -->
<div class="mb-3">
  <button type="button" class="btn btn-outline-primary btn-sm" (click)="generateYears()">Generate Year Inputs</button>
</div>

  
<!-- Yearly Inputs Table -->
<div formArrayName="years" class="table-responsive">
  <table class="table table-bordered align-middle text-center">
    <thead class="table-light">
      <tr>
        <th>Year</th>
        <th>Revenues</th>
        <th>COGS</th>
        <th>Employee Expense</th>
        <th>SGA Expense</th>
        <th>Depreciation</th>
        <th>Interest Expense</th>
        <th>Other Income</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let year of yearsArray.controls; let i = index" [formGroupName]="i">
        <td>{{ year.get('year')?.value }}</td>
        <td><input formControlName="revenues" type="number" class="form-control" /></td>
        <td><input formControlName="cogs" type="number" class="form-control" /></td>
        <td><input formControlName="employeeExpense" type="number" class="form-control" /></td>
        <td><input formControlName="sgaExpense" type="number" class="form-control" /></td>
        <td><input formControlName="depreciation" type="number" class="form-control" /></td>
        <td><input formControlName="interestExpense" type="number" class="form-control" /></td>
        <td><input formControlName="otherIncome" type="number" class="form-control" /></td>
      </tr>
    </tbody>
  </table>
</div>

      <div class="mt-3">
        <button class="btn btn-primary" type="submit" [disabled]="valuationForm.invalid">
          Submit Valuation
        </button>
      </div>
    </form>
  </div>
