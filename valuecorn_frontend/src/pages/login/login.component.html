<div class="login-wrapper">
  <mat-card class="login-card">
    <div class="text-center mb-3">
      <img src="../../assets/logo.png" alt="Valuecorn Logo" width="120" />
      <h4 class="title">Welcome to Valuecorn</h4>
      <p class="subtitle small">Business Valuation Simplified</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" autocomplete="off" class="form-vertical">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email address</mat-label>
        <input matInput formControlName="email" type="email" placeholder="you@domain.com" />
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Enter a valid email</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" placeholder="••••••••" />
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loginForm.invalid">
        Log In
      </button>

      <mat-error *ngIf="error" class="error-box">
        {{ error }}
      </mat-error>
    </form>

    <div class="text-center mt-3">
      <small>Don’t have an account? <a href="/register">Register</a></small>
    </div>
  </mat-card>
</div>
